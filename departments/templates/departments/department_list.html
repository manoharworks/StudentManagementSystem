{% extends "base.html" %}

{% block title %}

Departments

{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>

        Departments

    </h2>

    <a
        href="{% url 'departments:department_create' %}"
        class="btn btn-primary">

        Add Department

    </a>

</div>

<table class="table table-striped table-hover">

    <thead class="table-dark">

        <tr>

            <th>Code</th>

            <th>Name</th>

            <th>Actions</th>

        </tr>

    </thead>

    <tbody>

        {% for department in departments %}

        <tr>

            <td>

                {{ department.code }}

            </td>

            <td>

                <a
                    href="{% url 'departments:department_detail' department.pk %}"
                    class="text-decoration-none">

                    {{ department.name }}

                </a>

            </td>

            <td>
                <a
                    href="{% url 'departments:department_detail' department.pk %}"
                    class="btn btn-info btn-sm">

                    View

                </a>

                <a
                    href="{% url 'departments:department_update' department.pk %}"
                    class="btn btn-warning btn-sm">

                    Edit

                </a>

                <a
                    href="{% url 'departments:department_delete' department.pk %}"
                    class="btn btn-danger btn-sm">

                    Delete

                </a>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="3">

                No Departments Found

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
