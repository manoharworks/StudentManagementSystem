{% extends "base.html" %}

{% block title %}

{{ title }}

{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow">

            <div class="card-header">

                <h3>

                    {{ title }}

                </h3>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {% include "includes/form_fields.html" %}

                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-success">

                            Save

                        </button>

                        <a
                            href="{% url 'courses:course_list' %}"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
