<div class="card shadow-sm mb-4">

    <div class="card-header">

        <strong>Attendance Statistics</strong>

    </div>

    <div class="card-body">

        <div class="mb-3">

            <strong>

                Overall Attendance

            </strong>

            <div class="progress mt-2">

                <div
                    class="progress-bar bg-success"
                    role="progressbar"
                    style="width: {{ attendance_percentage }}%;">

                    {{ attendance_percentage }}%

                </div>

            </div>

        </div>

        <div class="row text-center">

            <div class="col">

                <h5>{{ present_count }}</h5>

                <small>Present</small>

            </div>

            <div class="col">

                <h5>{{ late_count }}</h5>

                <small>Late</small>

            </div>

            <div class="col">

                <h5>{{ absent_count }}</h5>

                <small>Absent</small>

            </div>

            <div class="col">

                <h5>{{ left_count }}</h5>

                <small>Left</small>

            </div>

        </div>

    </div>

</div>
