{% extends "base.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header">

        <h4>{{ title }}</h4>

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {% include "includes/form_fields.html" %}

            <div class="mt-3">

                <button class="btn btn-primary">

                    Save

                </button>

                <a
                    href="{% url 'attendance:attendance_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
