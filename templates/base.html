<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% block title %} Student Management System {% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container d-flex justify-content-between align-items-center">
        <a
          class="navbar-brand fs-3 fw-bold"
          href="{% url 'students:student_list' %}"
        >
          Student Management System
        </a>

        <!-- Authentication Area (Moved inside the container) -->
        <div>
          {% if user.is_authenticated %}

          <span class="text-white me-3"> Hello {{ user.username }} </span>

          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-light" type="submit">Logout</button>
          </form>

          {% else %}

          <a
            class="btn btn-outline-light me-2"
            href="{% url 'accounts:login' %}"
          >
            Login
          </a>

          <a class="btn btn-success" href="{% url 'accounts:signup' %}">
            SignUp
          </a>

          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      {% if messages %} {% for message in messages %}

      <div class="alert alert-success alert-dismissible fade show">
        {{ message }}

        <button class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      {% endfor %} {% endif %} {% block content %} {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
