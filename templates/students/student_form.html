{%extends "base.html"%}

{%block title%}
{%endblock%}



{%block content%}
<h2>Add Student</h2>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {% for field in form %}

        <div class="mb-3">

            <label class="form-label">

                {{ field.label }}

            </label>

            {{ field }}

            {% if field.errors %}

                <div class="text-danger">

                    {{ field.errors }}

                </div>

            {% endif %}

        </div>

    {% endfor %}

    <button
        class="btn btn-success">

        Save

    </button>


    <a
        href="{% url 'students:student_list' %}"
        class="btn btn-secondary">

        Cancel

    </a>    

</form>
{%endblock%}
