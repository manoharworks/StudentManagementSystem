{%extends "base.html"%}

{%block title%}
{%endblock%}



{%block content%}
<h2>Add Student</h2>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="btn btn-success">

        Save

    </button>

    <a
        href="{% url 'students:student_list' %}"
        class="btn btn-secondary">

        Cancel

    </a>

</form>
{%endblock%}
