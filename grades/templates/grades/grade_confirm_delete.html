{% extends "base.html" %}

{% block title %}
Delete Grade
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-danger text-white">

        <h4>

            Delete Grade

        </h4>

    </div>

    <div class="card-body">

        <p>

            Are you sure you want to delete the grade for

            <strong>

                {{ grade.enrollment.student }}

            </strong>

            in

            <strong>

                {{ grade.enrollment.course }}

            </strong>?

        </p>

        <form method="post">

            {% csrf_token %}

            <button class="btn btn-danger">

                Delete

            </button>

            <a
                href="{% url 'grades:grade_list' %}"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
