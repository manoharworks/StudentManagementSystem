{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card">

<div class="card-header">

<h3>Create Account</h3>

</div>

<div class="card-body">

<form method="post">

{% csrf_token %}

{% for field in form %}

<div class="mb-3">

<label class="form-label">

{{ field.label }}

</label>

{{ field }}

{% if field.errors %}

<div class="text-danger">

{{ field.errors }}

</div>

{% endif %}

</div>

{% endfor %}

<button class="btn btn-success">

Register

</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
